<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      下面这几行给搜索引擎和微信分享预览看。爬虫不执行 JS，所以必须直接写在这里。
      上线前填写：title / description / og:*（与 data.js 的 profile、site 保持一致）
    -->
    <title>樊烨 · AI 产品经理</title>
    <meta name="description" content="樊烨 · AI 产品经理 · 善用 AI 提效，搭建工作流" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="樊烨 · AI 产品经理" />
    <meta property="og:description" content="樊烨 · AI 产品经理 · 善用 AI 提效，搭建工作流" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="https://zeroonehub.github.io/" />
    <meta name="theme-color" content="#f6f9fd" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="masthead" id="masthead">
      <div class="wrap mast-inner">
        <a class="mast-brand" href="#top" id="mast-brand"></a>
        <nav class="mast-nav" id="nav-links" aria-label="网站主导航"></nav>
        <div class="mast-actions">
          <button class="ghost-btn" id="theme-btn" type="button" aria-label="切换深浅色">
            <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="ghost-btn menu-btn" id="menu-btn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="top">
      <div class="wrap"><div class="setup-banner" id="setup-banner" hidden></div></div>

      <!-- 封面 -->
      <section class="cover" id="hero">
        <div class="wrap">
          <div class="issue-line" id="issue-line"></div>
          <div class="cover-grid">
            <div class="cover-text">
              <p class="cover-role" id="hero-role"></p>
              <h1 class="cover-name" id="hero-name"></h1>
              <p class="cover-en" id="hero-name-en"></p>
              <p class="cover-tagline" id="hero-tagline"></p>
              <p class="cover-proof" id="hero-proof"></p>
              <div class="cover-actions" id="hero-actions"></div>
            </div>
            <aside class="cover-side">
              <div class="portrait" id="portrait"></div>
              <ul class="cover-tags" id="hero-tags"></ul>
              <dl class="cover-facts" id="hero-facts"></dl>
            </aside>
          </div>
        </div>
      </section>

      <section class="pillars-band" id="pillars" hidden>
        <div class="wrap"><div class="pillars" id="pillars-list"></div></div>
      </section>

      <section class="section" id="about" hidden>
        <div class="wrap sec-grid">
          <header class="sec-head"><span class="sec-no">壹</span><h2>关于我</h2><p class="sec-en">About</p></header>
          <div class="about-body" id="about-body"></div>
        </div>
      </section>

      <section class="section" id="projects" hidden>
        <div class="wrap">
          <header class="sec-head wide"><span class="sec-no">贰</span><h2>项目</h2><p class="sec-en">Works</p>
            <div class="filters" id="project-filters" role="tablist" aria-label="按方向筛选"></div>
          </header>
          <div class="card-grid" id="project-list"></div>
        </div>
      </section>

      <section class="section" id="research" hidden>
        <div class="wrap sec-grid">
          <header class="sec-head"><span class="sec-no">叁</span><h2>正在研究</h2><p class="sec-en">Now</p></header>
          <ol class="now-list" id="research-list"></ol>
        </div>
      </section>

      <section class="section" id="articles" hidden>
        <div class="wrap sec-grid">
          <header class="sec-head"><span class="sec-no">肆</span><h2>文章</h2><p class="sec-en">Writing</p></header>
          <div class="article-list" id="article-list"></div>
        </div>
      </section>

      <section class="section" id="tools" hidden>
        <div class="wrap sec-grid">
          <header class="sec-head"><span class="sec-no">伍</span><h2>工具与小作品</h2><p class="sec-en">Tools</p></header>
          <div class="tool-grid" id="tool-list"></div>
        </div>
      </section>

      <section class="section" id="events" hidden>
        <div class="wrap sec-grid">
          <header class="sec-head"><span class="sec-no">陆</span><h2>活动</h2><p class="sec-en">Events</p></header>
          <div class="event-grid" id="event-list"></div>
        </div>
      </section>

      <section class="contact" id="contact" hidden>
        <div class="wrap">
          <p class="contact-kicker">Get in touch · 联系我</p>
          <p class="contact-intro" id="contact-intro"></p>
          <div class="contact-primary" id="contact-primary"></div>
          <div class="channel-grid" id="channel-list"></div>
          <div class="qr-row" id="qr-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner" id="footer"></div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
