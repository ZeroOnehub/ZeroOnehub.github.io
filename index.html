<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      下面这几行给搜索引擎和微信分享预览看。爬虫不执行 JS，所以必须直接写在这里。
      与 data.js 的 profile、site 保持一致
    -->
    <title>樊烨 · AI 产品经理</title>
    <meta name="description" content="樊烨 · AI 产品经理 · 善用 AI 提效，搭建工作流" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="樊烨 · AI 产品经理" />
    <meta property="og:description" content="樊烨 · AI 产品经理 · 善用 AI 提效，搭建工作流" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="https://zeroonehub.github.io/" />
    <meta name="theme-color" content="#f4f7fc" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- 工具栏 -->
    <header class="toolbar">
      <div class="tb-inner">
        <a class="tb-brand" href="#top">
          <span class="tb-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M7.4 12c5 0 4-6 9.2-6M7.4 12c5 0 4 6 9.2 6"/></svg>
          </span>
          <span class="tb-name" id="tb-name"></span><span class="tb-file">/ portfolio.flow</span>
        </a>
        <nav class="tb-nav" id="nav-links" aria-label="网站主导航"></nav>
        <div class="tb-actions">
          <button class="run-btn" id="run-btn" type="button">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span>运行</span>
          </button>
          <button class="ghost-btn" id="theme-btn" type="button" aria-label="切换深浅色">
            <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="ghost-btn menu-btn" id="menu-btn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="top">
      <div class="wrap"><div class="setup-banner" id="setup-banner" hidden></div></div>

      <!-- 首屏：节点图 -->
      <section class="hero" id="hero">
        <div class="wrap">
          <div class="canvas-meta" id="canvas-meta"></div>

          <div class="graph" id="graph">
            <svg class="wires" id="wires" aria-hidden="true"></svg>

            <div class="node trigger" id="n-trigger">
              <div class="node-head">
                <span class="n-ico warn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>
                <span class="n-type">触发器</span>
              </div>
              <div class="node-body">
                <p class="trig-text">有人打开了这个页面</p>
                <p class="trig-meta"><code>on: page_view</code><span id="trig-time"></span></p>
              </div>
              <span class="port out" data-port="t-out"></span>
            </div>

            <div class="node agent" id="n-agent">
              <span class="port in" data-port="a-in"></span>
              <div class="node-head">
                <span class="n-ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/></svg></span>
                <span class="n-type" id="agent-role"></span>
                <span class="n-id">Agent</span>
              </div>
              <div class="node-body">
                <div class="agent-top">
                  <div class="agent-id">
                    <h1 class="agent-name" id="hero-name"></h1>
                    <p class="agent-en" id="hero-name-en"></p>
                  </div>
                  <div class="avatar" id="avatar"></div>
                </div>
                <p class="agent-tagline" id="hero-tagline"></p>
                <p class="agent-proof" id="hero-proof"></p>
                <dl class="params" id="params"></dl>
              </div>
              <div class="node-foot">
                <div class="bar"><i id="agent-bar"></i></div>
                <span class="n-status" id="agent-status">等待触发</span>
              </div>
              <span class="port out" data-port="a-out"></span>
            </div>

            <div class="outputs" id="outputs"></div>
          </div>
        </div>
      </section>

      <!-- 下面的节点由 main.js 根据 data.js 生成 -->
      <div class="flow" id="flow"></div>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner" id="footer"></div>
    </footer>

    <aside class="log" id="log" hidden aria-label="执行日志">
      <div class="log-head">
        <span><i class="log-dot"></i>执行日志</span>
        <button class="log-close" id="log-close" type="button" aria-label="关闭日志">×</button>
      </div>
      <ol class="log-list" id="log-list"></ol>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
